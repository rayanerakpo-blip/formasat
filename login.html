<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormaSat - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-sm">
    <div class="auth-header">
        <a href="index.php" class="logo">Forma<span>Sat</span></a>
        <p>Connectez-vous pour évaluer vos modules</p>
    </div>

    <div class="card">
        <div class="card-title">Connexion</div>
        <div class="card-subtitle">Accédez à votre espace stagiaire</div>

        <div id="message"></div>

        <form action="login_traitement.php" method="POST">
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required placeholder="jean.dupont@email.com">
            </div>

            <div class="form-group">
                <label for="mot_de_passe">Mot de passe</label>
                <input type="password" id="mot_de_passe" name="mot_de_passe" required placeholder="********">
            </div>

            <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
    </div>

    <div class="auth-footer auth-links">
        <a href="inscription.html" class="link">Créer un compte</a>
        <span aria-hidden="true">-</span>
        <a href="admin_login.php" class="link">Espace admin</a>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const message = document.getElementById('message');
if (params.has('erreur') || params.has('succes')) {
    const type = params.has('erreur') ? 'error' : 'success';
    message.className = `alert alert-${type}`;
    message.textContent = params.get(type === 'error' ? 'erreur' : 'succes');
}
</script>
</body>
</html>
